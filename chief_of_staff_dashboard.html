<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0D1520">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src http: https:; img-src data:; base-uri 'none'; form-action 'none'">
<title>Chief of Staff — Operator Dashboard</title>
<style>
/* =====================================================================
   DESIGN TOKENS  (status colours are functional, never decorative:
   green = healthy, orange = needs a human, red = danger/blocked,
   blue = activity/info. Every status also carries a distinct SHAPE and
   a text label, so colour is never the only signal.)
   ===================================================================== */
:root{
  --bg:#0D1520; --surface:#15202E; --surface-2:#1B2A3B; --line:#2C3E54;
  --text:#EDF2F8; --muted:#A9B7C9;
  --ok:#4BE0A0;   --ok-bg:#123527;   --on-ok:#05241A;
  --warn:#FFB454; --warn-bg:#3A2A10;
  --bad:#FF7B7B;  --bad-bg:#3F1A1F;
  --info:#6DB8FF; --info-bg:#132C46;
  --focus:#FFD166; --radius:16px; --shadow:0 1px 0 rgba(255,255,255,.03) inset;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EEF2F7; --surface:#FFFFFF; --surface-2:#F3F6FA; --line:#C7D2E0;
    --text:#0F1B2A; --muted:#41536A;
    --ok:#076B42; --ok-bg:#DDF5EA; --on-ok:#FFFFFF;
    --warn:#8F3F00; --warn-bg:#FFEBD0;
    --bad:#A61B1B; --bad-bg:#FDE0E0;
    --info:#0A4FA0; --info-bg:#DCEBFB;
    --focus:#0B57D0; --shadow:none;
  }
}
:root[data-theme="light"]{
  --bg:#EEF2F7; --surface:#FFFFFF; --surface-2:#F3F6FA; --line:#C7D2E0;
  --text:#0F1B2A; --muted:#41536A;
  --ok:#076B42; --ok-bg:#DDF5EA; --on-ok:#FFFFFF;
  --warn:#8F3F00; --warn-bg:#FFEBD0;
  --bad:#A61B1B; --bad-bg:#FDE0E0;
  --info:#0A4FA0; --info-bg:#DCEBFB;
  --focus:#0B57D0; --shadow:none;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.875em;overflow-wrap:anywhere}
a{color:var(--info)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--focus);color:#000;padding:10px 14px;border-radius:8px;z-index:100;font-weight:700}
.skip:focus{top:8px}
.hint{color:var(--muted);font-size:.875rem}
.muted{color:var(--muted)}

/* ---------- header ---------- */
.topbar{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px;
  padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--line)}
.brand{text-align:center;min-width:0}
.brand h1{font-size:clamp(.78rem,4vw,1.25rem);letter-spacing:.05em;white-space:nowrap;font-weight:800;overflow:hidden}
.brand p{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topright{display:flex;align-items:center;gap:4px}
.iconbtn{position:relative;width:48px;height:48px;display:grid;place-items:center;border:0;background:transparent;color:var(--text);border-radius:12px;cursor:pointer}
.iconbtn:hover{background:var(--surface-2)}
.badge{position:absolute;top:4px;right:2px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--bad);color:#fff;
  font-size:.8125rem;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.badge[hidden]{display:none}
@media (max-width:359px){
  .brand p{display:none}
  .iconbtn{width:44px;height:44px}
  #connPill .t{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
}

/* ---------- pills / chips ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1.5px solid currentColor;
  font-weight:700;font-size:.875rem;line-height:1.35;white-space:nowrap;background:var(--surface-2)}
.pill .g{font-size:.8em}
.pill.ok{color:var(--ok);background:var(--ok-bg)} .pill.warn{color:var(--warn);background:var(--warn-bg)}
.pill.bad{color:var(--bad);background:var(--bad-bg)} .pill.info{color:var(--info);background:var(--info-bg)}
.pill.mute{color:var(--muted);background:var(--surface-2)}
.pill.lg{font-size:1.0625rem;padding:6px 14px}
.src{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.8125rem;font-weight:800;letter-spacing:.03em;border:1.5px solid currentColor}
.src.live{color:var(--ok)} .src.mock{color:var(--warn)} .src.error{color:var(--bad)} .src.recorded{color:var(--info)}
.mode{display:inline-block;padding:1px 8px;border-radius:6px;font-size:.8125rem;font-weight:700;border:1px solid var(--line);color:var(--muted)}
.mode.LIVE{color:var(--ok);border-color:var(--ok)}
.mode.MOCK{color:var(--warn);border-color:var(--warn)}

/* ---------- layout ---------- */
.shell{display:block}
main{padding:14px 12px calc(28px + env(safe-area-inset-bottom));max-width:1500px;margin:0 auto;min-width:0}
main:focus{outline:none}
.view-title{font-size:1.375rem;font-weight:800;margin:4px 2px 14px}
.stack{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.card-head h2,.card-head h3{font-size:1.0625rem;font-weight:750}
.head-right{display:inline-flex;gap:8px;align-items:center}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--text);
  font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.btn.bad-o{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.info{border-color:var(--info);color:var(--info);background:transparent}
.btn.sm{min-height:44px;padding:0 14px}
.btn.is-disabled,.btn[disabled]{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.actions .btn{flex:1 1 96px}
.link{color:var(--info);font-weight:700;text-decoration:none;display:inline-flex;min-height:44px;align-items:center}
.link:hover{text-decoration:underline}

.dash{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:720px){
  main{padding:18px 20px 32px}
  .dash{grid-template-columns:1fr 1fr;grid-template-areas:"status status" "attention attention" "missions activity" "health provider" "flow flow"}
  .a-status{grid-area:status}.a-attention{grid-area:attention}.a-missions{grid-area:missions}.a-activity{grid-area:activity}
  .a-health{grid-area:health}.a-provider{grid-area:provider}.a-flow{grid-area:flow}
}
@media (min-width:1360px){
  .dash{grid-template-columns:1fr 1.25fr 1fr;grid-template-areas:"status status health" "flow flow flow" "attention missions activity" "attention missions provider"}
}
.grid2{display:grid;gap:14px}
@media (min-width:720px){.grid2{grid-template-columns:1fr 1fr}}
@media (min-width:1360px){.grid3{display:grid;gap:14px;grid-template-columns:1fr 1fr 1fr}}

/* ---------- banner ---------- */
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;font-weight:700;border:2px solid currentColor}
.banner.mock{color:var(--warn);background:var(--warn-bg)}
.banner.error{color:var(--bad);background:var(--bad-bg)}
.banner .btn{min-height:44px}
.banner small{display:block;font-weight:500;color:var(--text);font-size:.875rem}

/* ---------- status / attention ---------- */
.status-line{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.route-txt{font-size:1.25rem;font-weight:800}
.lines{display:grid;gap:8px;margin-top:12px;font-size:.9375rem}
.lines b{font-weight:700}
.calm{display:flex;gap:12px;align-items:center;color:var(--ok);font-weight:750}
.alert-head{display:grid;gap:8px;margin-bottom:12px}
.alert-count{font-size:1.25rem;font-weight:850;display:flex;gap:10px;align-items:center}
.alert-count.warn{color:var(--warn)} .alert-count.bad{color:var(--bad)}
.alert-count .g{font-size:1rem}
.approval{border:2px solid var(--warn);background:var(--warn-bg);border-radius:14px;padding:14px;margin-top:12px}
.approval.bad{border-color:var(--bad);background:var(--bad-bg)}
.approval h3{font-size:1.125rem;margin:10px 0 6px}
.approval .mid{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.approval .meta{color:var(--muted);font-size:.875rem;margin-top:6px;overflow-wrap:anywhere}
.approval .hint{margin-top:10px}
.other-alerts{display:grid;gap:4px;margin-top:10px}

/* ---------- mission rows/cards ---------- */
.mrows{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:center;padding:12px;min-height:56px;border-radius:12px;background:var(--surface-2);
  border:1px solid var(--line);color:var(--text);text-decoration:none}
.mrow:hover{border-color:var(--muted)}
.mrow .t{min-width:0}
.mrow .o{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .i{color:var(--muted);font-size:.8125rem}
.mission{padding:0;overflow:hidden}
.m-head{all:unset;box-sizing:border-box;display:block;width:100%;padding:14px 16px;cursor:pointer}
.m-head:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.m-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.pills{display:inline-flex;gap:6px;flex-wrap:wrap}
.m-obj{display:block;font-weight:700;font-size:1.0625rem;margin:8px 0 4px}
.m-sub{display:block;color:var(--muted);font-size:.875rem}
.m-body{padding:4px 16px 16px;border-top:1px solid var(--line)}
.m-body[hidden]{display:none}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 14px;margin:12px 0}
.kv dt{color:var(--muted);font-size:.9375rem}
.kv dd{overflow-wrap:anywhere;font-weight:600}
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.ladder li{border:1.5px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:.8125rem;font-weight:700;color:var(--muted);overflow-wrap:anywhere}
.ladder li .g{display:block;font-size:1rem;margin-bottom:2px}
.ladder li.done{color:var(--ok);border-color:var(--ok)}
.ladder li.wait{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.ladder li.stop{color:var(--bad);border-color:var(--bad);background:var(--bad-bg)}
.ladder li.now{color:var(--info);border-color:var(--info)}
.ladder-cap{font-size:.875rem;color:var(--muted)}

/* ---------- activity / audit ---------- */
.feed{display:grid;gap:2px}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev time{color:var(--muted);font-weight:700}
.ev .what{font-weight:700;overflow-wrap:anywhere}
.ev .det{color:var(--muted);font-size:.9375rem;grid-column:2;overflow-wrap:anywhere}
.ev.viol{background:var(--bad-bg);border:2px solid var(--bad);border-radius:12px;padding:12px;margin:6px 0;color:var(--bad)}
.ev.viol .det{color:var(--text)}
.ev.viol time{color:var(--bad)}
.ev-id{font-weight:500;color:var(--muted)}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tiles li{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2);min-width:0}
.tiles .l{color:var(--muted);font-size:.875rem}
.tiles .v{font-weight:750;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tiles .v.ok{color:var(--ok)}.tiles .v.warn{color:var(--warn)}.tiles .v.bad{color:var(--bad)}.tiles .v.mute{color:var(--muted)}
.tiles li:last-child:nth-child(odd){grid-column:1/-1}

/* ---------- flow strip (the one memorable element) ---------- */
.flow{display:flex;flex-wrap:wrap;gap:8px 6px;align-items:center}
.flow li{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--surface-2);border:1.5px solid var(--line);font-weight:650}
.flow li:not(:last-child)::after{content:"›";color:var(--muted);margin-left:4px;font-weight:800}
.flow li.gate{border:2.5px solid var(--warn);background:var(--warn-bg);color:var(--warn);font-weight:850}
.flow-cap{margin-top:12px;color:var(--muted);font-size:.9375rem}

/* ---------- provider route diagram ---------- */
.route{display:grid;gap:0;justify-items:start;margin:4px 0}
.rnode{border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:8px 14px;font-weight:750;min-width:150px}
.rnode small{display:block;color:var(--muted);font-weight:500;font-size:.8125rem;overflow-wrap:anywhere}
.rnode.used{border-color:var(--ok)} .rnode.failed{border-color:var(--bad)}
.redge{margin-left:26px;padding:6px 0 6px 14px;border-left:3px solid var(--line);font-weight:700;font-size:.9375rem}
.redge.ok{border-color:var(--ok);color:var(--ok)} .redge.bad{border-color:var(--bad);color:var(--bad)} .redge.warn{border-color:var(--warn);color:var(--warn)}
.call{padding:14px}
.call .kv{margin:10px 0 0}

/* ---------- research ---------- */
.rs{display:grid;gap:10px}
.ext{display:inline-flex;gap:6px;align-items:center;font-size:.8125rem;font-weight:800;color:var(--info);border:1.5px solid var(--info);border-radius:6px;padding:1px 8px}
.quote{margin:0;padding:10px 12px;border-left:4px solid var(--info);background:var(--surface-2);border-radius:0 10px 10px 0;overflow-wrap:anywhere;font-style:italic}
.bar{display:inline-block;width:110px;height:10px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);vertical-align:middle;overflow:hidden;margin-right:8px}
.bar i{display:block;height:100%;background:var(--info)}
.injflag{color:var(--warn);font-weight:700}

/* ---------- filters ---------- */
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.segbtn{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-weight:650;cursor:pointer}
.segbtn[aria-pressed="true"]{background:var(--info-bg);color:var(--info);border-color:var(--info)}
select,input[type=text],input[type=url],input[type=password]{width:100%;min-height:48px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--surface-2);color:var(--text);font:inherit}
label{display:block;font-weight:650;margin:12px 0 6px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.row .btn{flex:1 1 120px}

/* ---------- tests ---------- */
.legend{display:grid;gap:10px}
.legend li{display:grid;gap:4px}
.t17{border:2px solid var(--ok)}
.big{font-size:2rem;font-weight:850;line-height:1.1}
.checks{display:grid;gap:6px;margin-top:12px}
.checks li{display:flex;gap:8px;align-items:baseline}
.checks .g{color:var(--ok);font-weight:800}
.test{padding:14px 16px}
.test-top{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;align-items:flex-start}
.test h3{font-size:1.0625rem;margin:8px 0 6px}
details{margin-top:8px}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700;color:var(--info)}
details p{color:var(--muted);padding-bottom:4px}

/* ---------- settings / gateway ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tab{min-height:44px;display:inline-flex;align-items:center;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);color:var(--text);text-decoration:none;font-weight:650;background:var(--surface)}
.tab[aria-current="page"]{background:var(--info-bg);color:var(--info);border-color:var(--info)}
.gw{display:grid;gap:8px;justify-items:center;text-align:center}
.gw .box{border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 16px;font-weight:750;width:100%;max-width:360px}
.gw .arrow{color:var(--muted);font-weight:800}
.gw .conns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.gw .conns span{border:1.5px dashed var(--muted);border-radius:10px;padding:8px 12px;color:var(--muted);font-weight:650}
.steps{display:grid;gap:8px;counter-reset:s;margin-top:12px}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:center;font-weight:650}
.steps li::before{content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);font-size:.875rem;flex:none}
.chan{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chan:last-child{border-bottom:0}
.cmd{margin:10px 0 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);overflow-x:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.875rem}
.chk{display:flex;align-items:center;gap:12px;min-height:48px;margin:12px 0 0;font-weight:650;cursor:pointer}
.chk input{width:24px;height:24px;flex:none;accent-color:var(--info)}
.stepno{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);font-size:.875rem;margin-right:8px}

/* ---------- layers: drawer, notifications, modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.scrim[hidden]{display:none}
.layer{position:fixed;z-index:50;background:var(--surface);color:var(--text);visibility:hidden;transition:transform .18s ease,visibility 0s linear .18s}
.layer.open{visibility:visible;transition:transform .18s ease}
.drawer{top:0;bottom:0;left:0;width:min(86vw,320px);transform:translateX(-102%);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto;
  padding-top:env(safe-area-inset-top)}
.drawer.open{transform:none}
.drawer h2{font-size:.9375rem;color:var(--muted);letter-spacing:.06em;padding:18px 18px 8px;font-weight:800}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:0 18px;color:var(--text);text-decoration:none;font-weight:650;font-size:1.0625rem;border-left:4px solid transparent}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{border-left-color:var(--info);background:var(--surface-2);color:var(--info)}
.nav .n{min-width:24px;height:24px;border-radius:12px;background:var(--warn);color:#1a1000;display:grid;place-items:center;font-size:.8125rem;font-weight:850;padding:0 6px}
.nav .n.bad{background:var(--bad);color:#fff}
.sysfoot{margin-top:auto;border-top:1px solid var(--line);padding:14px 18px 20px;display:grid;gap:8px}
.sysfoot .h{color:var(--muted);font-size:.875rem;font-weight:800;letter-spacing:.06em}
.sysfoot .r{display:flex;justify-content:space-between;gap:8px;align-items:center}
.notif{top:0;right:0;bottom:0;width:min(100vw,400px);transform:translateX(102%);border-left:1px solid var(--line);display:flex;flex-direction:column}
.notif.open{transform:none}
.np-head{display:flex;justify-content:space-between;align-items:center;padding:12px 12px 12px 18px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.np-head h2{font-size:1.125rem}
.np-body{overflow-y:auto;padding:8px 18px 24px}
.nitem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.nitem .txt{overflow-wrap:anywhere}
.nitem .sub{grid-column:2;color:var(--muted);font-size:.875rem;overflow-wrap:anywhere}
.modal{left:50%;top:50%;width:min(94vw,520px);max-height:88vh;overflow-y:auto;transform:translate(-50%,-46%);opacity:0;border:1px solid var(--line);border-radius:18px;padding:20px}
.modal.open{transform:translate(-50%,-50%);opacity:1}
.modal h2{font-size:1.25rem;margin-bottom:10px}

<script>
(() => {
'use strict';

/* =====================================================================
   LAYER 0 — CONFIG
   Model names and endpoints are the ones established in the project
   (Tests 11, 16 and 17). Do not change them silently.
   ===================================================================== */
const CONFIG = Object.freeze({
  pollMs: 10000,
  providers: Object.freeze({
    gemini: Object.freeze({ id:'gemini', label:'Gemini', role:'Primary',  model:'gemini-2.5-flash',
      host:'generativelanguage.googleapis.com',
      modelUrl:'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash' }),
    groq: Object.freeze({ id:'groq', label:'Groq', role:'Fallback', model:'openai/gpt-oss-120b',
      host:'api.groq.com', listUrl:'https://api.groq.com/openai/v1/models' })
  }),
  storage: Object.freeze({ keyPrefix:'cos.proto.key.', backendUrl:'cos.proto.backend.url', backendToken:'cos.proto.backend.token', theme:'cos.proto.theme' })
});
const SPECIALISTS = ['Researcher','Analyst','Creator','Critic'];   // v1: four specialists (see GENERAL_CHIEF_OF_STAFF_FINAL_SPEC.md §3)

/* =====================================================================
   LAYER 1 — UTILITIES (escaping template tag: every interpolated value is
   HTML-escaped unless it is already a Safe fragment. Backend and research
   content can therefore never become markup or instructions.)
   ===================================================================== */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
class Safe { constructor(s){ this.s = s; } toString(){ return this.s; } }
const fmt  = v => v instanceof Safe ? v.s : Array.isArray(v) ? v.map(fmt).join('') : esc(v);
const html = (strs, ...vals) => new Safe(strs.reduce((o, s, i) => o + s + (i < vals.length ? fmt(vals[i]) : ''), ''));
const enc  = encodeURIComponent;
const pad  = n => String(n).padStart(2, '0');
const lc   = v => String(v ?? '').toLowerCase();
const up   = (v, d='') => String(v ?? d).toUpperCase();
const arr  = v => Array.isArray(v) ? v : [];
function fmtTime(ts){ const d = new Date(ts); return isNaN(d) ? '—' : `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtTimeS(ts){ const d = new Date(ts); return isNaN(d) ? '—' : `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function fmtDT(ts){ const d = new Date(ts); return isNaN(d) ? '—' : `${d.toLocaleDateString(undefined,{month:'short',day:'numeric'})} ${fmtTime(ts)}`; }
function ago(ts){ const t = new Date(ts).getTime(); if (isNaN(t)) return '—'; const s = Math.max(0,(Date.now()-t)/1000);
  if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s/60)+' min ago'; if (s < 86400) return Math.floor(s/3600)+' h ago'; return Math.floor(s/86400)+' d ago'; }
function safeUrl(u){ try { const x = new URL(String(u)); return (x.protocol === 'http:' || x.protocol === 'https:') ? x.href : null; } catch { return null; } }
const ls = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); return true; } catch { return false; } },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
async function fetchT(url, opts={}, ms=10000){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try { return await fetch(url, { ...opts, signal: ctl.signal, cache:'no-store', credentials:'omit' }); }
  finally { clearTimeout(t); }
}

/* Presentational vocab. Shape + text + colour, never colour alone. */
const RISK = {
  LOW:     { cls:'ok',   g:'●', label:'LOW RISK',     note:'Auto-completion permitted' },
  MEDIUM:  { cls:'warn', g:'▲', label:'MEDIUM RISK',  note:'Human approval required' },
  HIGH:    { cls:'bad',  g:'■', label:'HIGH RISK',    note:'Human approval + additional scrutiny' },
  UNKNOWN: { cls:'bad',  g:'■', label:'UNKNOWN RISK', note:'Unrecognised tier — treated as HIGH' }
};
const MSTATUS = {
  IN_PROGRESS:{cls:'info',g:'◆',label:'IN PROGRESS'}, PROPOSED:{cls:'info',g:'◆',label:'PROPOSED'},
  AWAITING_APPROVAL:{cls:'warn',g:'▲',label:'NEEDS APPROVAL'}, APPROVED:{cls:'info',g:'◆',label:'APPROVED'},
  EXECUTED:{cls:'info',g:'◆',label:'EXECUTED'}, COMPLETED:{cls:'ok',g:'✓',label:'COMPLETED'},
  REJECTED:{cls:'mute',g:'✕',label:'REJECTED'}, BLOCKED:{cls:'bad',g:'■',label:'BLOCKED'}, FAILED:{cls:'bad',g:'■',label:'FAILED'}
};
const ACTIVE = new Set(['IN_PROGRESS','PROPOSED','AWAITING_APPROVAL','APPROVED','EXECUTED']);
const AUDIT_LABEL = {
  PROPOSED:'Proposed', RESEARCH_STARTED:'Research started', RESEARCH_COMPLETED:'Research completed', GROUNDING_FAILED:'Grounding failed',
  RISK_CLASSIFIED:'Risk classified', PROVIDER_FALLBACK:'Provider fallback', APPROVAL_REQUESTED:'Approval requested', APPROVED:'Human approved',
  REJECTED:'Human rejected', EXECUTED:'Executed', COMPLETED:'Completed', EXECUTION_BLOCKED:'Execution blocked', FAILED:'Execution failed'
};
const riskOf = t => RISK[t] || RISK.UNKNOWN;
const isHigh = t => t === 'HIGH' || !RISK[t];
const pill = (cls, g, label, extra='') => html`<span class="pill ${cls} ${extra}"><span class="g" aria-hidden="true">${g}</span><span class="t">${label}</span></span>`;
const riskPill = t => { const r = riskOf(t); return pill(r.cls, r.g, r.label); };
const statusPill = s => { const m = MSTATUS[s] || { cls:'mute', g:'?', label:s }; return pill(m.cls, m.g, m.label); };
const srcChip = k => html`<span class="src ${k}" title="Data source: ${k}">${k === 'error' ? 'ERROR' : k.toUpperCase()}</span>`;
const provName = p => CONFIG.providers[lc(p)]?.label || (p ? String(p) : '—');

/* =====================================================================
   LAYER 2 — STATE
   ===================================================================== */
const store = {
  conn: 'demo',            // 'demo' (no backend configured) | 'live' | 'error'
  origin: 'demo',          // what the DATA on screen really is: 'live' | 'backend_mock' | 'demo' | 'stale'
  data: null, demo: null, lastLive: null, liveAt: null, lastError: '', errKind: '', tokenUnverified: false,
  sig: '',
  prov: { gemini:{state:'none'}, groq:{state:'none'} },   // browser-side key tests
  view: 'dashboard', arg: '',
  ui: { filters: { missions:'all', research:'all', audit:'all', auditMission:'all', auditSort:'new' } }
};
const canDecide = () => store.conn === 'live' && (store.origin === 'live' || store.origin === 'backend_mock');
const dataKind  = () => store.origin === 'live' ? 'live' : store.origin === 'stale' ? 'error' : 'mock';
function disabledReason(){
  if (store.conn === 'demo')  return 'Demo data — approvals are disabled. Nothing was changed. Connect the backend in Settings.';
  if (store.conn === 'error') return (store.errKind === 'notoken' || store.errKind === 'auth' ? 'Not authenticated — ' : 'Backend unreachable — ') + 'approvals are disabled. Nothing was changed.';
  return 'Approvals are unavailable right now.';
}

/* =====================================================================
   LAYER 3 — PROVIDER LAYER (browser-side key vault + connection tests)
   Prototype only: localStorage is NOT production secret management.
   Only this layer reads a stored key; the UI never renders one.
   The Chief of Staff backend uses its own keys from its environment.
   ===================================================================== */
const Vault = {
  has:   n => !!ls.get(CONFIG.storage.keyPrefix + n),
  get:   n => ls.get(CONFIG.storage.keyPrefix + n) || '',
  set:   (n,v) => ls.set(CONFIG.storage.keyPrefix + n, v),
  clear: n => ls.del(CONFIG.storage.keyPrefix + n)
};
const Providers = {
  async test(name){
    if (Backend.served) return;   // served by the backend: provider keys live server-side only
    const c = CONFIG.providers[name]; const key = Vault.get(name);
    if (!key) return setProv(name, { state:'none', detail:'No key stored.' });
    setProv(name, { state:'testing', detail:`Contacting ${c.host}…` });
    let res;
    try { res = name === 'gemini' ? await this.testGemini(key) : await this.testGroq(key); }
    catch (e) {
      res = { state:'error', detail: e && e.name === 'AbortError' ? 'Timed out after 10 s.' : 'Network error — check the connection (or browser CORS).' };
    }
    return setProv(name, { ...res, testedAt: Date.now() });
  },
  async testGemini(key){
    const c = CONFIG.providers.gemini; let r;
    try { r = await fetchT(c.modelUrl, { headers:{ 'x-goog-api-key': key } }); }
    catch (e) { if (e && e.name === 'AbortError') throw e;
      r = await fetchT(c.modelUrl + '?key=' + enc(key)); }   // header form blocked by CORS/proxy → query form (prototype only)
    return classify(r.status, `Model ${c.model} is available.`, `Model ${c.model} was not found for this key.`);
  },
  async testGroq(key){
    const c = CONFIG.providers.groq;
    const r = await fetchT(c.listUrl, { headers:{ Authorization: 'Bearer ' + key } });
    if (r.status !== 200) return classify(r.status, '', '');
    let j = {}; try { j = await r.json(); } catch {}
    const ok = arr(j.data).some(m => m && m.id === c.model);
    return ok ? { state:'connected', detail:`Model ${c.model} is available.`, http:200 }
              : { state:'modelmissing', detail:`Key valid, but model ${c.model} is not listed.`, http:200 };
  }
};
function classify(status, okMsg, missMsg){
  if (status === 200) return { state:'connected', detail: okMsg, http: status };
  if (status === 400 || status === 401 || status === 403) return { state:'authfail', detail:`Key rejected (HTTP ${status}).`, http: status };
  if (status === 404) return { state:'modelmissing', detail: missMsg, http: status };
  if (status === 429) return { state:'limited', detail:'Key accepted, but the provider is rate-limiting (HTTP 429).', http: status };
  return { state:'error', detail:`Unexpected response (HTTP ${status}).`, http: status };
}
function setProv(name, s){ store.prov[name] = s; paintProvStatus(name); paintSysFoot(); return s; }
const PSTATE = {
  connected:   ['ok','●','CONNECTED'], testing:['info','◌','TESTING'], none:['bad','■','NOT CONNECTED'],
  authfail:    ['bad','■','AUTHENTICATION FAILED'], limited:['warn','▲','CONNECTED · RATE LIMITED'],
  modelmissing:['warn','▲','KEY VALID · MODEL NOT FOUND'], error:['bad','■','CONNECTION ERROR']
};
const PSHORT = { connected:'Connected', testing:'Testing…', none:'No key', authfail:'Auth failed', limited:'Rate limited', modelmissing:'Model missing', error:'Error' };

/* =====================================================================
   LAYER 4 — BACKEND LAYER (the backend is authoritative)
   Contract (see README):
     GET  {base}/api/snapshot
     POST {base}/api/missions/{id}/decision   {decision:"APPROVED"|"REJECTED"}
   The dashboard never changes decision state locally: it asks, then re-reads.
   ===================================================================== */
const Backend = {
  // served = true ONLY after GET /health on this page's own origin identified itself as the
  // Chief of Staff backend. Opened from file:// or hosted elsewhere, it stays false and the
  // dashboard needs an explicit API URL (development) — it never guesses one.
  served: false,
  override(){ return (ls.get(CONFIG.storage.backendUrl) || '').replace(/\/+$/, ''); },   // optional API URL (development/testing)
  base(){ const o = this.override(); if (o) return o; return this.served ? window.location.origin : ''; },
  configured(){ return !!this.base(); },
  hasToken(){ return !!ls.get(CONFIG.storage.backendToken); },
  async detect(){
    this.served = false;
    if (!/^https?:$/.test(window.location.protocol)) return;
    try {
      const r = await fetchT(window.location.origin + '/health', {}, 4000);
      if (r.ok) { const j = await r.json(); this.served = !!j && j.service === 'chief-of-staff-backend'; }
    } catch {}
  },
  headers(extra={}){ const t = ls.get(CONFIG.storage.backendToken); const h = { Accept:'application/json', ...extra }; if (t) h.Authorization = 'Bearer ' + t; return h; },
  async snapshot(){
    let r;
    try { r = await fetchT(this.base() + '/api/snapshot', { headers: this.headers() }, 8000); }
    catch (e) {
      const to = e && e.name === 'AbortError';
      throw Object.assign(new Error(to ? 'Timed out after 8 s — no HTTP response from ' + this.base() : 'Network-level failure: the browser got no HTTP response from ' + this.base()), { kind: to ? 'timeout' : 'network' });
    }
    if (r.status === 401) throw Object.assign(new Error('Backend answered HTTP 401 — the access token is missing or wrong'), { kind:'auth' });
    if (!r.ok) throw Object.assign(new Error('Backend answered HTTP ' + r.status), { kind:'http' });
    let j; try { j = await r.json(); } catch { throw Object.assign(new Error('Backend answered HTTP 200 but not with JSON — this is probably not the Chief of Staff API'), { kind:'http' }); }
    if (!j || typeof j !== 'object' || !Array.isArray(j.missions)) throw Object.assign(new Error('Backend answered HTTP 200 but the body is not a snapshot'), { kind:'http' });
    return j;
  },
  async decide(id, decision){
    if (decision !== 'APPROVED' && decision !== 'REJECTED') throw new Error('Invalid decision');
    const r = await fetchT(this.base() + '/api/missions/' + enc(id) + '/decision', {
      method:'POST', headers: this.headers({ 'Content-Type':'application/json' }),
      body: JSON.stringify({ decision, decided_by:'operator', client:'operator-dashboard' })   // decided_by is informational only: the server takes identity from the token
    }, 10000);
    let j = null; try { j = await r.json(); } catch {}
    if (!r.ok || !j || j.ok !== true) throw new Error((j && j.error) ? String(j.error) : 'Backend refused the decision (HTTP ' + r.status + ')');
    return j;
  }
};

/* =====================================================================
   LAYER 5 — DATA LAYER (normalise → never trust shape)
   ===================================================================== */
function normalize(raw){
  raw = raw && typeof raw === 'object' ? raw : {};
  const missions = arr(raw.missions).map(m => ({
    id:String(m.id ?? '?'), objective:String(m.objective ?? '(no objective)'), status:up(m.status,'UNKNOWN'),
    risk_tier: RISK[up(m.risk_tier)] ? up(m.risk_tier) : 'UNKNOWN', specialists: arr(m.specialists).map(String),
    provider_used: lc(m.provider_used), fallback_used: !!m.fallback_used, approval_status: up(m.approval_status,'—'),
    execution_status: up(m.execution_status,'—'), created_at: m.created_at, updated_at: m.updated_at, risk_reason: String(m.risk_reason || '')
  })).sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));
  let approvals = raw.approvals === undefined
    ? missions.filter(m => m.status === 'AWAITING_APPROVAL').map(m => ({ mission_id:m.id, title:m.objective, risk_tier:m.risk_tier, reason:m.risk_reason, requested_at:m.updated_at }))
    : arr(raw.approvals).map(a => ({ mission_id:String(a.mission_id ?? '?'), title:String(a.title ?? '(untitled)'),
        risk_tier: RISK[up(a.risk_tier)] ? up(a.risk_tier) : 'UNKNOWN', reason:String(a.reason || ''), requested_at:a.requested_at }));
  const calls = arr(raw.providers && raw.providers.calls).map(c => ({
    ts:c.ts, mission_id:String(c.mission_id ?? ''), attempted:lc(c.attempted_provider), attempted_status:c.attempted_status,
    used:lc(c.used_provider), model:String(c.model || ''), fallback:!!c.fallback_triggered, outcome: lc(c.outcome || 'success'), schema_valid: c.schema_valid
  })).sort((a,b) => new Date(b.ts) - new Date(a.ts));
  const specRaw = arr(raw.specialists);
  const specialists = SPECIALISTS.map(name => { const s = specRaw.find(x => lc(x && x.name) === lc(name));
    return s ? { name, status: lc(s.status || 'unknown'), task: String(s.current_task || '—'), last: s.last_activity || null, live:true }
             : { name, status:'nodata', task:'—', last:null, live:false }; });
  const research = arr(raw.research).map(r => { const g = up(r.grounding); const conf = Number(r.confidence);
    return { mission_id:String(r.mission_id ?? ''), query:String(r.query || ''), url:String(r.source_url || ''), fetched_at:r.fetched_at, snippet:String(r.snippet || ''),
      claim:String(r.claim || ''), confidence: isNaN(conf) ? null : (conf <= 1 ? conf*100 : conf), grounding: g === 'GROUNDING_FAILED' ? 'FAILED' : (['GROUNDED','UNCERTAIN','FAILED'].includes(g) ? g : 'UNCERTAIN'),
      uncertainty:String(r.uncertainty || ''), injection: !!r.injection_flag }; });
  const audit = arr(raw.audit).map(e => ({ ts:e.ts, mission_id:String(e.mission_id ?? ''), event:up(e.event), detail:String(e.detail || ''), violation: !!e.violation || up(e.event) === 'EXECUTION_BLOCKED' }))
    .sort((a,b) => new Date(b.ts) - new Date(a.ts));
  const mem = raw.memory || {}; const cnt = mem.counts || {};
  return {
    meta:{ generated_at: (raw.meta && raw.meta.generated_at) || new Date().toISOString(), mode: up(raw.meta && raw.meta.mode, 'LIVE') },
    system:{ status: lc(raw.system && raw.system.status || 'unknown') },
    providers:{ primary: lc(raw.providers && raw.providers.primary || 'gemini'), fallback: lc(raw.providers && raw.providers.fallback || 'groq'), calls },
    missions, approvals, specialists, research, audit,
    memory:{ engine:String(mem.engine || 'SQLite'), counts:{ missions:cnt.missions, decisions:cnt.decisions, research:cnt.research, audit:cnt.audit },
      readback:{ status: up(mem.fresh_readback && mem.fresh_readback.status, 'UNKNOWN'), at: mem.fresh_readback && mem.fresh_readback.verified_at } },
    health: raw.health || {}
  };
}
function makeDemo(){
  const now = Date.now(), t = m => new Date(now - m*60000).toISOString();
  const missions = [
    { id:'DEMO-M3', objective:'Staff-meeting briefing built on externally researched claims', status:'AWAITING_APPROVAL', risk_tier:'HIGH',
      specialists:['Researcher','Analyst','Creator','Critic'], provider_used:'gemini', fallback_used:false, approval_status:'PENDING', execution_status:'NOT STARTED',
      created_at:t(41), updated_at:t(6), risk_reason:'Source contained instruction-like text; Critic flagged the claim; classifier forced HIGH.' },
    { id:'DEMO-M5', objective:'Board-meeting pack draft for external distribution', status:'AWAITING_APPROVAL', risk_tier:'MEDIUM',
      specialists:['Researcher','Analyst','Creator','Critic'], provider_used:'gemini', fallback_used:false, approval_status:'PENDING', execution_status:'NOT STARTED',
      created_at:t(22), updated_at:t(9), risk_reason:'Draft is intended for an external audience.' },
    { id:'DEMO-M6', objective:'Competitor pricing scan for next planning cycle', status:'IN_PROGRESS', risk_tier:'LOW', specialists:['Researcher'],
      provider_used:'gemini', fallback_used:false, approval_status:'NOT REQUIRED', execution_status:'NOT STARTED', created_at:t(4), updated_at:t(1) },
    { id:'DEMO-M2', objective:'Weekly portfolio summary', status:'COMPLETED', risk_tier:'LOW', specialists:['Researcher','Analyst','Creator','Critic'], provider_used:'groq', fallback_used:true,
      approval_status:'AUTO (LOW TIER)', execution_status:'COMPLETED', created_at:t(95), updated_at:t(88) },
    { id:'DEMO-M1', objective:'Agenda summary for Monday staff meeting', status:'COMPLETED', risk_tier:'LOW', specialists:['Researcher','Analyst','Creator','Critic'], provider_used:'gemini', fallback_used:false,
      approval_status:'AUTO (LOW TIER)', execution_status:'COMPLETED', created_at:t(130), updated_at:t(126) },
    { id:'DEMO-M4', objective:'Market note from an unreachable source', status:'REJECTED', risk_tier:'HIGH', specialists:['Researcher','Analyst','Creator','Critic'], provider_used:'gemini', fallback_used:false,
      approval_status:'REJECTED', execution_status:'NOT EXECUTED', created_at:t(170), updated_at:t(160), risk_reason:'Grounding fetch returned 0 bytes; no verifiable evidence.' }
  ];
  const ev = (m, id, event, detail, violation) => ({ ts:t(m), mission_id:id, event, detail, violation:!!violation });
  const audit = [

function applyData(conn, origin, data){
  const sig = conn + '|' + origin + '|' + JSON.stringify(data) + '|' + store.lastError + '|' + store.errKind + '|' + store.tokenUnverified;
  store.conn = conn; store.origin = origin; store.data = data;
  const changed = sig !== store.sig; store.sig = sig; return changed;
}
async function refresh(){
  if (!store.demo) store.demo = makeDemo();
  let changed;
  if (!Backend.served && !Backend.override()) await Backend.detect();   // re-check "is this page served by the backend?" until it is
  if (!Backend.configured()) { changed = applyData('demo','demo', store.demo); }
  else if (!Backend.hasToken()) {
    // No token: do not even call the API (it would only write a failed-auth row to the audit log on every poll).
    store.tokenUnverified = false; store.lastLive = null; store.errKind = 'notoken'; store.lastError = 'No access token is saved on this device.';
    changed = applyData('error','demo', store.demo);
  }
  else {
    try {
      const d = normalize(await Backend.snapshot()); store.lastLive = d; store.liveAt = Date.now(); store.lastError = ''; store.errKind = ''; store.tokenUnverified = false;
      changed = applyData('live', d.meta.mode === 'MOCK' ? 'backend_mock' : 'live', d);
    } catch (e) {
      store.tokenUnverified = false; store.errKind = (e && e.kind) || 'network';
      store.lastError = (e && e.message) || 'network error';
      if (store.errKind === 'auth') store.lastLive = null;   // a rejected token means we no longer know anything is live
      changed = store.lastLive ? applyData('error','stale', store.lastLive) : applyData('error','demo', store.demo);
    }
  }
  if (changed) onData();
}

const NOTIFY = {
  approval_high:{ g:'■', cls:'bad',  label:'High-risk approval required', needs:true },
  approval:{ g:'▲', cls:'warn', label:'Approval required', needs:true },
  grounding_failed:{ g:'▲', cls:'warn', label:'Research grounding failed', needs:true },
  fallback:{ g:'◆', cls:'info', label:'Provider fallback', needs:false },
  completed:{ g:'✓', cls:'ok',   label:'Mission completed', needs:false },

  { id:'slack', label:'Slack', state:'reserved' }, { id:'sms', label:'SMS', state:'reserved' }, { id:'other', label:'Other connectors', state:'reserved' } ] };
function buildNotifications(d){
  const out = [];
  d.approvals.forEach(a => out.push({ type: isHigh(a.risk_tier) ? 'approval_high' : 'approval', ts:a.requested_at, id:a.mission_id, text:a.title }));
  d.research.filter(r => r.grounding === 'FAILED').forEach(r => out.push({ type:'grounding_failed', ts:r.fetched_at, id:r.mission_id, text:r.claim || r.query }));
  d.providers.calls.filter(c => c.fallback).forEach(c => out.push({ type:'fallback', ts:c.ts, id:c.mission_id, text:`${provName(c.attempted)} → ${provName(c.used)} (HTTP ${c.attempted_status ?? '?'})` }));
  d.missions.filter(m => m.status === 'COMPLETED').forEach(m => out.push({ type:'completed', ts:m.updated_at, id:m.id, text:m.objective }));
  d.missions.filter(m => m.status === 'FAILED').forEach(m => out.push({ type:'failed', ts:m.updated_at, id:m.id, text:m.objective }));
  d.audit.filter(e => e.violation).forEach(e => out.push({ type:'blocked', ts:e.ts, id:e.mission_id, text:e.detail }));
  return out.sort((a,b) => new Date(b.ts) - new Date(a.ts)).slice(0, 25);
}

function ladder(m){

  else if (s === 'PROPOSED') steps = [L('Proposed','now','◆'), L('Approved','',''), L('Executed','',''), L('Completed','','')];
  else if (s === 'AWAITING_APPROVAL') steps = [L('Proposed','done','✓'), L('Approved','wait','▲'), L('Executed','',''), L('Completed','','')];
  else if (s === 'REJECTED') steps = [L('Proposed','done','✓'), L('Rejected','stop','✕'), L('Not executed','',''), L('—','','')];
  else if (s === 'APPROVED') steps = [L('Proposed','done','✓'), L('Approved','done','✓'), L('Executed','now','◆'), L('Completed','','')];
  else if (s === 'EXECUTED') steps = [L('Proposed','done','✓'), L('Approved','done','✓'), L('Executed','done','✓'), L('Completed','now','◆')];
  else if (s === 'COMPLETED') steps = [L('Proposed','done','✓'), L('Approved','done','✓'), L('Executed','done','✓'), L('Completed','done','✓')];
  else if (s === 'FAILED') steps = [L('Proposed','done','✓'), L('Approved','done','✓'), L('Failed','stop','■'), L('—','','')];
  else if (s === 'BLOCKED') steps = [L('Proposed','done','✓'), L('No approval','stop','■'), L('Blocked','stop','■'), L('—','','')];
  else steps = [L('Proposed','',''), L('Approved','',''), L('Executed','',''), L('Completed','','')];

const focusables = el => $$('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])', el);

document.addEventListener('keydown', e => {
  if (!Layers.cur) return;

  if (e.key !== 'Tab') return;

/* boot */
(async function init(){
  const th = ls.get(CONFIG.storage.theme); if (th === 'dark' || th === 'light') document.documentElement.setAttribute('data-theme', th);
  buildNav(); syncDrawer();
  await Backend.detect();   // same-origin default: only if GET {window.location.origin}/health says "chief-of-staff-backend"
  await refresh(); paintChrome(); renderView({ nav:false });
  startPolling();
  if (!Backend.served) ['gemini','groq'].forEach(n => { if (Vault.has(n)) Providers.test(n); });   // re-test stored keys so the indicators are real, not remembered
})();
})();
</script>
