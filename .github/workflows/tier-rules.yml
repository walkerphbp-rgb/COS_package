name: tier-rules
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run 19b
        run: node test19b_tier_rules.js
      - name: Run 19c
        run: node test19c_runanalyst_regression.js
      - name: Run 19d
        run: node test19d_mission_failure.js
      - name: Run 20 (fixed gate)
        run: node test20_gate.js fixed
      - name: Run 21 (integration)
        run: node test21_integration.js
      - name: Run 22 (grounding, fixed)
        run: node test22_grounding.js fixed
      # Mutation checks: the same tests MUST fail against the old code, proving they detect the defects.
      - name: Mutation check - gate original must be DETECTED
        run: |
          # exit 1 + MUTATION-DETECTED = tests caught the old defects (pass); exit 2 = harness error (fail); exit 0 = not detected (fail)
          set +e
          out=$(node test20_gate.js original 2>&1)
          rc=$?
          echo "$out"
          if [ "$rc" -eq 2 ]; then echo "test20 harness error (not a detection)"; exit 1; fi
          if [ "$rc" -eq 0 ]; then echo "test20 passed on the original gate: tests do not detect the defects"; exit 1; fi
          if ! echo "$out" | grep -qx 'MUTATION-DETECTED'; then echo "test20 failed without a MUTATION-DETECTED line"; exit 1; fi
      - name: Mutation check - grounding original must be DETECTED
        run: |
          # exit 1 + MUTATION-DETECTED = tests caught the old defects (pass); exit 2 = harness error (fail); exit 0 = not detected (fail)
          set +e
          out=$(node test22_grounding.js original 2>&1)
          rc=$?
          echo "$out"
          if [ "$rc" -eq 2 ]; then echo "test22 harness error (not a detection)"; exit 1; fi
          if [ "$rc" -eq 0 ]; then echo "test22 passed on the original grounding: tests do not detect the defects"; exit 1; fi
          if ! echo "$out" | grep -qx 'MUTATION-DETECTED'; then echo "test22 failed without a MUTATION-DETECTED line"; exit 1; fi
      - name: Run 23 (persistence safety, local)
        run: node test23_persistence.js
      - name: Run 24 (entrypoint + Dockerfile readiness; behavioural half skips when not root)
        run: node test24_entrypoint.js
      - name: Run 25 (Decision Memory retrieval API)
        run: node test25_decision_memory.js
      - name: Run 26 (formats, restrict-only policy)
        run: node test26_formats.js
      - name: Run 27 (live-check page logic)
        run: node test27_format_runner.js
      - name: Run 28 (router - modes, privilege, schema v3)
        run: node test28_router.js
      - name: Run 29 (B2 backup and recovery)
        run: node test29_b2_backup.js
      - name: Run 30 (recovery check page logic)
        run: node test30_recovery_check.js
      - name: Run 16 v2 (provider fallback, real module)
        run: node test16_v2.js
      - name: Provider timeout tests
        run: node test_provider_timeout.js
      - name: Test transport errors and grounding timeout
        run: node test_transport_and_grounding.js
